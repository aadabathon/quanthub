[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-hub"
version = "0.4.0"
description = "A modular quantitative finance research and trading workstation."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    # The Qt GUI (D31): widgets, fast interactive charts, icon fonts.
    "PySide6>=6.7",
    "pyqtgraph>=0.13.7",
    "qtawesome>=1.3",
]

[project.optional-dependencies]
# The IBKR TWS API is optional: the application runs fully on synthetic data
# without it. PyPI carries an old build (9.81); the current official package
# is distributed at https://interactivebrokers.github.io - either works for
# the read-only functionality in v0.1.
ibkr = ["ibapi"]
dev = ["pytest>=8"]

[project.gui-scripts]
# gui-scripts (not scripts) so the generated launcher is a windowed exe --
# no console window, so it can be double-clicked or pinned like a normal
# Windows app. `python -m quant_hub` still gives console/log output for
# debugging.
# `quant-hub` always launches the *current* UI, so a desktop shortcut to it
# never goes stale (D31). The classic Tk UI stays reachable until it is
# retired.
quant-hub = "quant_hub.app_qt:main_qt"
quant-hub-classic = "quant_hub.app:main"

[tool.setuptools.packages.find]
include = ["quant_hub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
