[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-hub"
# Single source of truth: quant_hub/__init__.py's __version__ (read statically,
# without importing the package).
dynamic = ["version"]
description = "A modular quantitative finance research and trading workstation."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    # Figures for scripts and notebooks (visualization/); the app itself
    # draws with pyqtgraph.
    "matplotlib>=3.8",
    # The GUI (D31): Qt widgets, fast interactive charts, icon fonts.
    "PySide6>=6.7",
    "pyqtgraph>=0.13.7",
    "qtawesome>=1.3",
]

[project.optional-dependencies]
# The IBKR TWS API is optional: the application runs fully on synthetic data
# without it. PyPI carries an old build (9.81); the current official package
# is distributed at https://interactivebrokers.github.io - either works for
# the read-only functionality in v0.1.
ibkr = ["ibapi"]
dev = ["pytest>=8"]

[project.gui-scripts]
# gui-scripts (not scripts) so the generated launcher is a windowed exe --
# no console window, so it can be double-clicked or pinned like a normal
# Windows app. `python -m quant_hub` still gives console/log output for
# debugging. A desktop shortcut should target this launcher.
quant-hub = "quant_hub.app:main"

[tool.setuptools.packages.find]
include = ["quant_hub*"]

[tool.setuptools.dynamic]
version = {attr = "quant_hub.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
